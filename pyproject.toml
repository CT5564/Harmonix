[project]
name = "harmonix"
version = "0.1.0"
description = "Harmonix 2.0 — your always-on, voice-first personal AI assistant"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.0.0",
    "kokoro-onnx>=0.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "pystray>=0.19.0",
    "pillow>=10.0.0",
    "notion-client>=3.1.0",
    "websocket-client>=1.9.0",
    "aiohttp>=3.14.3",
]

[tool.uv]
package = false
